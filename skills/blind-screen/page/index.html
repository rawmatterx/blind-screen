<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind Screen</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6a65; --line:#e3e1da;
  --inc:#1f7a4d; --inc-bg:#e3f3ea; --exc:#b3261e; --exc-bg:#fbe7e5; --uns:#9a6700; --uns-bg:#fdf3d7;
  --accent:#2f5fb3; --hl-inc:#cdeedb; --hl-exc:#f9d3cf; --kbd:#efede6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17181a; --panel:#202225; --ink:#ecebe6; --muted:#9c9b95; --line:#33353a;
    --inc:#5fd39a; --inc-bg:#173527; --exc:#ff8a80; --exc-bg:#3a1f1d; --uns:#f2c14e; --uns-bg:#3a3117;
    --accent:#8fb3ff; --hl-inc:#1f4a33; --hl-exc:#5a2925; --kbd:#2c2e32;
  }
}
:root[data-theme="dark"]{
  --bg:#17181a; --panel:#202225; --ink:#ecebe6; --muted:#9c9b95; --line:#33353a;
  --inc:#5fd39a; --inc-bg:#173527; --exc:#ff8a80; --exc-bg:#3a1f1d; --uns:#f2c14e; --uns-bg:#3a3117;
  --accent:#8fb3ff; --hl-inc:#1f4a33; --hl-exc:#5a2925; --kbd:#2c2e32;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--kbd);color:var(--muted)}
.pill.adj{background:var(--uns-bg);color:var(--uns)}
.prog{flex:1;min-width:160px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.counts{font-size:12px;color:var(--muted);white-space:nowrap}
.counts b{font-weight:600}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
main.ft{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 320px}
.pdf{border-right:1px solid var(--line);min-height:0}
.pdf iframe{width:100%;height:100%;border:0;background:#fff}
.rec{overflow:auto;padding:28px 36px 60px}
.rec .rid{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rec h2{font-size:21px;line-height:1.35;margin:6px 0 10px;font-weight:650}
.meta{color:var(--muted);font-size:13px;margin-bottom:18px}
.meta a{color:var(--accent);text-decoration:none}
.abs{font-size:16px;line-height:1.7;max-width:76ch;white-space:pre-wrap}
mark.i{background:var(--hl-inc);color:inherit;border-radius:3px;padding:0 2px}
mark.x{background:var(--hl-exc);color:inherit;border-radius:3px;padding:0 2px}
.current{margin:0 0 18px;padding:8px 12px;border-radius:8px;font-size:13px;display:none}
.current.INCLUDE{display:block;background:var(--inc-bg);color:var(--inc)}
.current.EXCLUDE{display:block;background:var(--exc-bg);color:var(--exc)}
.current.UNSURE{display:block;background:var(--uns-bg);color:var(--uns)}
.both{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 20px}
.both > div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.both h4{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.both .d{font-weight:650}
.d.INCLUDE{color:var(--inc)} .d.EXCLUDE{color:var(--exc)} .d.UNSURE{color:var(--uns)}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:18px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 0 8px;font-weight:600}
aside h3:first-child{margin-top:0}
.btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:9px 11px;margin:0 0 6px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.inc{color:var(--inc)} .btn.uns{color:var(--uns)}
.btn.code{font-size:13.5px;color:var(--exc)}
.btn.code span.t{color:var(--ink)}
.btn.sel{outline:2px solid currentColor;outline-offset:-1px}
kbd{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--kbd);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 6px;min-width:22px;text-align:center;color:var(--ink)}
textarea,input[type=text]{width:100%;font:inherit;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
textarea{height:54px;resize:vertical}
.nav{display:flex;gap:6px}
.nav .btn{justify-content:center;margin:0}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
.crit{white-space:pre-wrap;font-size:12.5px;line-height:1.5;color:var(--ink);background:var(--bg);border-radius:8px;padding:10px;margin-top:8px;max-height:40vh;overflow:auto}
.keys{font-size:12px;color:var(--muted);line-height:2}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .15s;pointer-events:none;max-width:90vw}
.toast.on{opacity:.95}
.toast.err{background:var(--exc);color:#fff}
.done{padding:60px 36px;max-width:640px}
.done h2{font-size:22px}
.awaitcode .code{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{background:var(--exc-bg)}}
@media (max-width:820px){
  main,main.ft{grid-template-columns:1fr}
  aside{border-left:0;border-top:1px solid var(--line)}
  .pdf{height:60vh}
  .rec{padding:20px 16px 40px}
  header{padding:10px 16px}
}
</style>
</head>
<body>
<header>
  <h1>Blind Screen</h1>
  <span class="pill" id="stagePill"></span>
  <span class="pill" id="modePill"></span>
  <div class="prog"><div class="bar"><i id="barFill"></i></div><span class="counts" id="counts"></span></div>
</header>
<main id="main">
  <div class="pdf" id="pdfPane" hidden><iframe id="pdfFrame" title="Full text"></iframe></div>
  <section class="rec" id="rec"></section>
  <aside id="side">
    <h3>Decision</h3>
    <div id="buttons"></div>
    <h3>Note <span style="text-transform:none;letter-spacing:0">(optional, <kbd>N</kbd>)</span></h3>
    <textarea id="note" placeholder="Why, if it's not obvious"></textarea>
    <h3>Move</h3>
    <div class="nav">
      <button class="btn" id="prev"><kbd>&larr;</kbd></button>
      <button class="btn" id="next"><kbd>&rarr;</kbd></button>
      <button class="btn" id="gonext" title="Next undecided"><kbd>G</kbd> next open</button>
    </div>
    <h3>Highlight words</h3>
    <input type="text" id="hlInc" placeholder="green: psma, recurrence, pet" style="margin-bottom:6px">
    <input type="text" id="hlExc" placeholder="red: review, case report, mice">
    <h3>Eligibility criteria</h3>
    <details open><summary>From the protocol</summary><div class="crit" id="crit"></div></details>
    <h3>Keys</h3>
    <div class="keys" id="keys"></div>
  </aside>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  "use strict";
  var T = new URLSearchParams(location.search).get("t") || "";
  var S = null, idx = 0, awaitingCode = false, history = [];
  var $ = function(id){ return document.getElementById(id); };

  function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

  function toast(msg, err){
    var t = $("toast"); t.textContent = msg; t.className = "toast on" + (err ? " err" : "");
    clearTimeout(toast._h); toast._h = setTimeout(function(){ t.className = "toast"; }, err ? 4000 : 900);
  }

  function api(path, body){
    var opt = body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {};
    return fetch(path + (path.indexOf("?")<0?"?":"&") + "t=" + encodeURIComponent(T), opt)
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || r.status); return j; }); });
  }

  function esc(s){ return String(s||"").replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function highlight(text){
    var h = esc(text);
    function apply(list, cls){
      list.split(",").map(function(w){ return w.trim(); }).filter(function(w){ return w.length > 1; })
        .sort(function(a,b){ return b.length - a.length; })
        .forEach(function(w){
          var re = new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![^<]*>)", "gi");
          h = h.replace(re, '<mark class="' + cls + '">$1</mark>');
        });
    }
    apply($("hlExc").value, "x"); apply($("hlInc").value, "i");
    return h;
  }

  var codeKeys = [];
  function codeLabel(c){ return S.codes[c] || c; }
  function reasonText(d){
    if(!d) return "";
    if(d.decision === "EXCLUDE") return d.code + " – " + codeLabel(d.code) + (d.note ? " · " + d.note : "") + (d.reason ? " · " + d.reason : "");
    return d.note || d.reason || "";
  }

  function decidedCount(){ return S.records.filter(function(r){ return r.mine; }).length; }

  function renderHeader(){
    var n = S.records.length, d = decidedCount();
    $("barFill").style.width = (n ? 100*d/n : 100) + "%";
    var inc=0, exc=0, uns=0;
    S.records.forEach(function(r){ if(!r.mine) return; if(r.mine.decision==="INCLUDE")inc++; else if(r.mine.decision==="EXCLUDE")exc++; else uns++; });
    $("counts").innerHTML = "<b>" + d + "</b> / " + n + " &nbsp;·&nbsp; include " + inc + " · exclude " + exc + (S.mode==="screen" ? " · unsure " + uns : "");
  }

  function renderButtons(){
    var r = S.records[idx], cur = r && r.mine;
    var b = '<button class="btn inc' + (cur && cur.decision==="INCLUDE" ? " sel":"") + '" data-d="INCLUDE"><kbd>I</kbd> Include</button>';
    if(S.mode === "screen") b += '<button class="btn uns' + (cur && cur.decision==="UNSURE" ? " sel":"") + '" data-d="UNSURE"><kbd>?</kbd> Unsure</button>';
    b += '<div style="font-size:12px;color:var(--muted);margin:10px 0 6px">Exclude, with reason (<kbd>E</kbd> then number, or just the number)</div>';
    codeKeys.forEach(function(c, i){
      b += '<button class="btn code' + (cur && cur.decision==="EXCLUDE" && cur.code===c ? " sel":"") + '" data-d="EXCLUDE" data-c="' + c + '"><kbd>' + (i+1) + '</kbd> <span class="t"><b>' + c + '</b> ' + esc(S.codes[c]) + '</span></button>';
    });
    b += '<button class="btn" data-d="UNDO" style="margin-top:10px;color:var(--muted)"><kbd>Z</kbd> Undo last decision</button>';
    $("buttons").innerHTML = b;
    $("buttons").className = awaitingCode ? "awaitcode" : "";
  }

  function render(){
    renderHeader();
    if(!S.records.length){
      $("rec").innerHTML = '<div class="done"><h2>Nothing to adjudicate</h2><p>You and Claude agreed on every record. Go back to Claude and say <b>finalize</b>.</p></div>';
      return;
    }
    if(decidedCount() === S.records.length && !render.ackDone){
      render.ackDone = true;
      toast(S.mode==="screen" ? "All screened. You can review, or close this tab and tell Claude to reconcile." : "All disagreements decided. Tell Claude to finalize.");
    }
    var r = S.records[idx];
    var html = '<div class="rid">' + (idx+1) + ' of ' + S.records.length + ' · ' + esc(r.id) + '</div>';
    html += '<h2>' + highlight(r.title) + '</h2>';
    var meta = [esc(r.authors && r.authors.length > 140 ? r.authors.slice(0,140) + "…" : r.authors), esc(r.journal), esc(r.year)].filter(Boolean).join(" · ");
    var links = [];
    if(r.pmid) links.push('<a href="https://pubmed.ncbi.nlm.nih.gov/' + encodeURIComponent(r.pmid) + '/" target="_blank" rel="noopener">PMID ' + esc(r.pmid) + '</a>');
    if(r.doi) links.push('<a href="https://doi.org/' + esc(r.doi) + '" target="_blank" rel="noopener">DOI</a>');
    html += '<div class="meta">' + meta + (links.length ? ' · ' + links.join(" · ") : "") + '</div>';
    if(S.mode === "adjudicate"){
      html += '<div class="both"><div><h4>You (round 1)</h4><div class="d ' + r.human.decision + '">' + r.human.decision + '</div><div>' + esc(reasonText(r.human)) + '</div></div>' +
              '<div><h4>Claude (round 2)</h4><div class="d ' + r.claude.decision + '">' + r.claude.decision + '</div><div>' + esc(reasonText(r.claude)) + '</div></div></div>';
    }
    if(r.mine) html += '<div class="current ' + r.mine.decision + '">' + (S.mode==="adjudicate" ? "Final: " : "Your decision: ") + r.mine.decision + (r.mine.code ? " · " + r.mine.code + " " + esc(codeLabel(r.mine.code)) : "") + (r.mine.note ? " · " + esc(r.mine.note) : "") + '</div>';
    html += '<div class="abs">' + (r.abstract ? highlight(r.abstract) : '<i style="color:var(--muted)">No abstract in the record.</i>') + '</div>';
    $("rec").innerHTML = html;
    $("rec").scrollTop = 0;
    $("note").value = r.mine && r.mine.note ? r.mine.note : "";
    if(S.has_pdf){
      var src = "/pdf/" + encodeURIComponent(r.id) + "?t=" + encodeURIComponent(T);
      if($("pdfFrame").getAttribute("src") !== src) $("pdfFrame").setAttribute("src", src);
    }
    renderButtons();
    store("bs-pos-" + S.stage + "-" + S.mode, String(idx));
  }

  function nextOpen(from){
    for(var k=1; k<=S.records.length; k++){
      var j = (from + k) % S.records.length;
      if(!S.records[j].mine) return j;
    }
    return -1;
  }

  // Saves go out strictly one after another, in keypress order, while the page moves on at once.
  var queue = Promise.resolve(), failed = false;
  function save(body, rec, prev){
    queue = queue.then(function(){
      if(failed) return;
      return api("/api/decide", body).catch(function(e){
        failed = true; rec.mine = prev; render();
        toast("NOT SAVED: " + e.message + " — reload the page before continuing.", true);
      });
    });
  }

  function decide(decision, code){
    if(S.locked){ toast("This stage is locked.", true); return; }
    if(failed){ toast("A save failed. Reload the page before continuing.", true); return; }
    var r = S.records[idx];
    if(decision === "UNDO"){
      var last = history.pop();
      var target = last !== undefined ? last : idx;
      var rr = S.records[target];
      if(!rr.mine){ toast("Nothing to undo"); return; }
      var before = rr.mine;
      rr.mine = null; idx = target; render.ackDone = false;
      save({id: rr.id, decision: "UNDO"}, rr, before);
      render(); toast("Undone");
      return;
    }
    var note = $("note").value.trim();
    var prev = r.mine;
    r.mine = {id: r.id, decision: decision, code: code || "", note: note};
    save({id: r.id, decision: decision, code: code || "", note: note}, r, prev);
    history.push(idx);
    var n = nextOpen(idx);
    if(n >= 0) idx = n;
    render();
    toast(decision === "EXCLUDE" ? "Excluded · " + code : (decision === "INCLUDE" ? "Included" : "Unsure"));
  }

  function move(d){ idx = Math.max(0, Math.min(S.records.length - 1, idx + d)); awaitingCode = false; render(); }

  document.addEventListener("keydown", function(ev){
    if(!S || !S.records.length) return;
    var tag = (ev.target.tagName || "").toLowerCase();
    if(tag === "textarea" || tag === "input"){
      if(ev.key === "Escape" || (ev.key === "Enter" && !ev.shiftKey && tag === "textarea")){ ev.preventDefault(); ev.target.blur(); }
      return;
    }
    if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var k = ev.key;
    if(/^[1-9]$/.test(k)){
      var c = codeKeys[parseInt(k,10) - 1];
      if(c){ ev.preventDefault(); awaitingCode = false; decide("EXCLUDE", c); }
      return;
    }
    awaitingCode = false;
    switch(k.toLowerCase()){
      case "i": ev.preventDefault(); decide("INCLUDE"); break;
      case "?": case "u": if(S.mode === "screen"){ ev.preventDefault(); decide("UNSURE"); } break;
      case "e": ev.preventDefault(); awaitingCode = true; renderButtons(); toast("Press the number of the exclusion reason"); break;
      case "z": ev.preventDefault(); decide("UNDO"); break;
      case "arrowleft": ev.preventDefault(); move(-1); break;
      case "arrowright": ev.preventDefault(); move(1); break;
      case "g": ev.preventDefault(); var n = nextOpen(idx - 1 < 0 ? S.records.length - 1 : idx - 1); if(n >= 0){ idx = n; render(); } else toast("Everything is decided"); break;
      case "n": ev.preventDefault(); $("note").focus(); break;
    }
  });

  $("buttons").addEventListener("click", function(ev){
    var b = ev.target.closest("button"); if(!b) return;
    decide(b.getAttribute("data-d"), b.getAttribute("data-c"));
  });
  $("prev").onclick = function(){ move(-1); };
  $("next").onclick = function(){ move(1); };
  $("gonext").onclick = function(){ var n = nextOpen(idx - 1 < 0 ? S.records.length - 1 : idx - 1); if(n >= 0){ idx = n; render(); } };
  ["hlInc","hlExc"].forEach(function(id){
    $(id).value = store("bs-" + id) || "";
    $(id).addEventListener("input", function(){ store("bs-" + id, $(id).value); if(S && S.records.length) render(); });
  });

  api("/api/state").then(function(s){
    S = s;
    codeKeys = Object.keys(S.codes).sort(function(a,b){ return parseInt(a.slice(1),10) - parseInt(b.slice(1),10); });
    $("stagePill").textContent = S.stage === "ta" ? "Title / abstract" : "Full text";
    $("modePill").textContent = S.mode === "screen" ? "Your independent screening" : "Resolve disagreements";
    if(S.mode === "adjudicate") $("modePill").className = "pill adj";
    $("crit").textContent = S.criteria;
    $("keys").innerHTML = "<kbd>I</kbd> include" + (S.mode==="screen" ? " &nbsp;<kbd>?</kbd> unsure" : "") +
      " &nbsp;<kbd>1</kbd>–<kbd>" + codeKeys.length + "</kbd> exclude<br><kbd>Z</kbd> undo &nbsp;<kbd>&larr;</kbd><kbd>&rarr;</kbd> move &nbsp;<kbd>G</kbd> next open &nbsp;<kbd>N</kbd> note";
    if(S.has_pdf){ $("pdfPane").hidden = false; $("main").className = "ft"; }
    var saved = parseInt(store("bs-pos-" + S.stage + "-" + S.mode) || "", 10);
    idx = 0;
    var first = nextOpen(-1);
    if(!isNaN(saved) && saved < S.records.length && !S.records[saved].mine) idx = saved;
    else if(first >= 0) idx = first;
    if(S.locked) toast("This stage is locked; you can look but not change decisions.", true);
    render();
  }).catch(function(e){
    $("rec").innerHTML = '<div class="done"><h2>Can’t open the screening page</h2><p>' + esc(e.message) + '</p></div>';
  });
})();
</script>
</body>
</html>
